<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNG CAFE</title>
  <link rel="stylesheet" href="test.css">
</head>

<body>
  <header>
    <h1>TNG CAFE</h1>
    <p>心安らぐ１杯をあなたに</p>
    <nav>
      <ul>
        <li><a href="#section1">About Us</a></li>
        <li><a href="#section2">Menu</a></li>
        <li><a href="#section3">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="section1">
      <h2>About Us</h2>
      <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
      <img src="#" alt="カフェの写真">
    </section>

    <section id="section2">
      <h2>Menu</h2>
      <div class="menu-list">
        <article class="menu-card">
          <img src="#" alt="コーヒー">
          <p>ブレンドコーヒー</p>
        </article>
        <article class="menu-card">
          <img src="#" alt="ケーキ">
          <p>ベイクドチーズケーキ</p>
        </article>
        <article class="menu-card">
          <img src="#" alt="ラテ">
          <p>カフェラテ</p>
        </article>
      </div>
    </section>

    <section id="section3">
      <h2>Contact</h2>
      <form action="#" method="post">
        <label for="name">お名前：</label>
        <input type="text" id="name" name="name">
        <label for="email">メールアドレス：</label>
        <input type="email" id="email" name="email">
        <label for="form">お問い合わせ内容：</label>
        <textarea id="form" name="form" rows="4" cols="40"></textarea>
        <button type="submit">送信</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 20○○ TNG Cafe</p>
  </footer>
</body>
</html>
